<!doctype html>
<!--
  The GitHub social preview card, 1280×640: the gallery ring with Riverbed facing the viewer.
  Serve the repository (npm start) and capture this page at a 1280×640 viewport, for example
  with Playwright, then save it at docs/images/social-preview.png (GitHub takes up to 1 MB). ORDER below sets
  which worlds flank it: the plasma globe on the left, the bonfire on the right.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Deskworlds social preview</title>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <style>
      :root { --card-width: 1280px; --card-height: 640px; --plane-width: 780px; --plane-height: calc(var(--plane-width) / 1.92); --plane-top: 172px; }
      html, body { width: var(--card-width); height: var(--card-height); overflow: hidden; }
      .card { position: relative; width: var(--card-width); height: var(--card-height); background: var(--background); overflow: hidden; perspective: 1400px; perspective-origin: 50% calc(var(--plane-top) + var(--plane-height) / 2); }
      /* The wordmark and the tagline share the front plane's left edge. */
      .masthead { position: absolute; top: 44px; left: calc((100% - var(--plane-width)) / 2); width: var(--plane-width); z-index: 2000; }
      h1 { display: flex; align-items: center; gap: 14px; margin: 0; font: 400 52px/1 var(--font-body); letter-spacing: -.04em; }
      .logo { width: 40px; height: 40px; flex: none; }
      .tagline { margin: 14px 0 0; font: 400 24px/1 var(--font-body); letter-spacing: -.01em; color: var(--text-muted); }
      .portal { position: absolute; left: calc((100% - var(--plane-width)) / 2); top: var(--plane-top); width: var(--plane-width); height: var(--plane-height); background: var(--surface); overflow: hidden; box-shadow: 0 32px 80px #00000066; filter: brightness(var(--brightness, 1)); }
      .portal img { width: 100%; height: 100%; object-fit: cover; display: block; }
      /* Only a neighbour's outer third shows beside the front plane, so its subject moves there. */
      .portal.is-neighbour img { position: absolute; top: 0; width: 110%; left: calc(var(--focus) - 55%); }
    </style>
  </head>
  <body>
    <div class="card">
      <header class="masthead">
        <h1><svg class="logo" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5 43 15.5 24 26 5 15.5Z" fill="currentColor" stroke-width="3.5"/><path d="M24 5 43 15.5V31.5L24 42 5 31.5V15.5ZM24 26V42" stroke-width="3.5"/><path d="M5 21C6.55 22.2 8.17 23.52 9.75 24.12C11.33 24.72 12.93 24.64 14.5 25.16C16.07 25.68 17.65 26.96 19.25 28.38C20.85 29.8 22.38 30.9 24 31.5C25.62 30.83 27.15 29.57 28.75 28.2C30.35 26.83 31.9 25.75 33.5 25.37C35.1 24.99 36.65 25.02 38.25 24.3C39.85 23.58 41.38 22.1 43 21M5 26.3C6.55 27.52 8.17 28.21 9.75 28.54C11.33 28.87 12.93 29.22 14.5 30.37C16.07 31.52 17.65 33.36 19.25 34.56C20.85 35.76 22.38 36.27 24 36.8C25.62 35.87 27.15 34.27 28.75 33.29C30.35 32.31 31.9 32.1 33.5 31.88C35.1 31.66 36.65 31.04 38.25 29.81C39.85 28.58 41.38 27.07 43 26.3" stroke-width="2.1"/></svg>Deskworlds</h1>
        <p class="tagline">Living 3D worlds for your Mac desktop</p>
      </header>
    </div>
    <script type="module">
      import { WORLDS, previewUrl } from '../ui/worlds.js';
      const card = document.querySelector('.card');
      const ORDER = ['lakescape', 'plasmascape', 'riverscape', 'bonfirescape', 'reefscape', 'bettascape', 'koiscape'];
      const ring = ORDER.map(id => WORLDS.find(world => world.id === id)).filter(Boolean);
      const front = ring.findIndex(world => world.id === 'riverscape');
      // The ring from ui/gallery.js: the front world faces the viewer, its neighbours recede to either side.
      const slot = 2 * Math.PI / ring.length;
      const layout = offset => {
        const angle = offset * slot;
        const depth = (1 - Math.cos(angle)) / (1 - Math.cos(slot));
        const side = Math.sin(angle) / Math.sin(slot);
        return { x: 48 * side, y: -4 * Math.min(depth, 1), z: -520 * depth, turn: -18 * side, depth };
      };
      const loads = ring.map((world, index) => {
        const offset = ((index - front + ring.length / 2) % ring.length + ring.length) % ring.length - ring.length / 2;
        const { x, y, z, turn, depth } = layout(Math.round(offset));
        const portal = document.createElement('div');
        portal.className = 'portal';
        if (Math.abs(Math.round(offset)) === 1) {
          portal.classList.add('is-neighbour');
          portal.style.setProperty('--focus', offset < 0 ? '19%' : '83%');
        }
        portal.style.transform = `translate3d(${x}%, ${y}%, ${z}px) rotateY(${turn}deg)`;
        portal.style.zIndex = Math.round(1000 / (1 + depth));
        portal.style.setProperty('--brightness', 1 - 0.55 * Math.min(depth, 1));
        const img = new Image();
        img.src = previewUrl(world);
        img.alt = world.alt;
        portal.append(img);
        card.append(portal);
        return img.decode();
      });
      Promise.all(loads).then(() => document.body.dataset.ready = 'true');
    </script>
  </body>
</html>
